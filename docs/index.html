<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORIX</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#eee;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{background:#151515;padding:40px 30px;border-radius:16px;border:1px solid #1f5f3f;width:340px;text-align:center;box-shadow:0 0 40px rgba(0,255,150,0.08)}
  h1{color:#0fb;margin-bottom:24px;font-size:22px;letter-spacing:2px}
  input{width:100%;padding:14px;background:#0d0d0d;color:#eee;border:1px solid #333;border-radius:8px;font-size:16px;text-align:center;letter-spacing:1px;direction:ltr}
  input:focus{outline:none;border-color:#0fb}
  button{margin-top:16px;width:100%;padding:12px;background:#0fb;color:#000;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
  button:active{transform:scale(0.98)}
  #err{color:#f44;margin-top:12px;font-size:12px;min-height:20px;word-break:break-all;font-family:monospace;direction:ltr;text-align:left}
  .logo{font-size:48px;margin-bottom:16px}
  .show{font-size:12px;color:#888;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🛡️</div>
    <h1>VORIX SECURITY</h1>
    <input type="password" id="pin" placeholder="رمز عبور" autocomplete="off">
    <p class="show" onclick="toggleShow()">👁️ نمایش رمز</p>
    <button onclick="check()">ورود</button>
    <p id="err"></p>
  </div>
<script>
const HASH_REV = "fe3b03f0ea1eeaa2568e796bc94cceb20ff0a87a1576c335dad7f10573b4e932";

function toggleShow() {
  const el = document.getElementById('pin');
  el.type = el.type === 'password' ? 'text' : 'password';
}

async function sha256(msg) {
  const buf = new TextEncoder().encode(msg);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2,'0')).join('');
}

async function check() {
  const pin = document.getElementById('pin').value;
  const h = await sha256(pin);
  const rev = h.split('').reverse().join('');
  const err = document.getElementById('err');
  err.style.whiteSpace = 'pre-wrap';
  err.style.fontSize = '11px';
  err.style.fontFamily = 'monospace';
  err.style.textAlign = 'left';
  if (rev === HASH_REV) {
    err.style.color = '#0fb';
    err.textContent = 'OK';
    localStorage.setItem('vorix_auth', 'ok');
    localStorage.setItem('vorix_pin', pin);
    window.location.href = 'vx7k2/index.html';
  } else {
    err.style.color = '#f44';
    err.textContent = 'WRONG\nlen=' + pin.length + '\nHASH=' + rev.substring(0,32) + '\nWANT=' + HASH_REV.substring(0,32);
  }
}

document.getElementById('pin').addEventListener('keypress', e => {
  if (e.key === 'Enter') check();
});
</script>
</body>
</html>
