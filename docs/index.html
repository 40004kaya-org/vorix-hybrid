<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORIX Board</title>
<link rel="stylesheet" href="style.css">
<style>
#lock{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;
      display:flex;align-items:center;justify-content:center;z-index:9999}
#lock .box{text-align:center;padding:40px 30px;background:#151515;
      border:1px solid #1f5f3f;border-radius:16px;width:340px;
      box-shadow:0 0 40px rgba(0,255,150,0.08)}
#lock .logo{font-size:48px;margin-bottom:16px}
#lock h1{color:#0fb;margin-bottom:24px;font-size:22px;letter-spacing:2px}
#lock input{width:100%;padding:14px;background:#0d0d0d;color:#eee;
      border:1px solid #333;border-radius:8px;font-size:16px;
      text-align:center;direction:ltr;letter-spacing:1px;box-sizing:border-box}
#lock input:focus{outline:none;border-color:#0fb}
#lock button{margin-top:16px;width:100%;padding:12px;background:#0fb;
      color:#000;border:none;border-radius:8px;font-size:16px;
      font-weight:bold;cursor:pointer}
#lock button:active{transform:scale(0.98)}
#lock #err{color:#f44;margin-top:12px;font-size:12px;min-height:20px}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="logo">🛡️</div>
    <h1>VORIX</h1>
    <input type="password" id="pin" placeholder="رمز عبور" autocomplete="off">
    <button onclick="unlock()">ورود</button>
    <p id="err"></p>
  </div>
</div>

<svg id="board" viewBox="0 0 900 780" preserveAspectRatio="xMidYMid meet"></svg>

<script>
const HASH_REV = "0cb5f542a18a13f39335d338fd9c8c6b0c71b89323f391b34ebcde03e51c1add";
async function unlock() {
  const pin = document.getElementById('pin').value;
  const buf = new TextEncoder().encode(pin);
  const h = await crypto.subtle.digest('SHA-256', buf);
  const rev = Array.from(new Uint8Array(h))
    .map(b => b.toString(16).padStart(2,'0')).join('')
    .split('').reverse().join('');
  if (rev === HASH_REV) {
    document.getElementById('lock').style.display = 'none';
  } else {
    document.getElementById('err').textContent = '❌ رمز اشتباه';
    document.getElementById('pin').value = '';
  }
}
document.getElementById('pin').addEventListener('keypress', e => {
  if (e.key === 'Enter') unlock();
});
</script>

<script src="board.js"></script>

</body>
</html>
