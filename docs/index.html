<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORIX Board</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070d;
    color: #e5e7eb;
    font-family: ui-monospace, monospace;
    padding: 10px;
    min-height: 100vh;
  }
  .board-svg {
    width: 100%;
    max-width: 900px;
    display: block;
    margin: 0 auto;
    background: #05070d;
  }
  .box { fill: #0d1320; stroke: #2a3548; stroke-width: 1.5; }
  .box.green { stroke: #10b981; }
  .box.yellow { stroke: #f59e0b; }
  .box.orange { stroke: #f97316; }
  .box.red { stroke: #ef4444; stroke-width: 2; }
  .label { fill: #9ca3af; font-size: 11px; text-anchor: middle; font-family: ui-monospace; }
  .title { fill: #10b981; font-size: 14px; font-weight: bold; text-anchor: middle; font-family: ui-monospace; }
  .sub { fill: #6b7280; font-size: 9px; text-anchor: middle; font-family: ui-monospace; }
  .chart-label { fill: #9ca3af; font-size: 9px; text-anchor: middle; font-family: ui-monospace; letter-spacing: 1px; }
  .line { stroke: #10b981; stroke-width: 1.5; fill: none; }
  .line.thin { stroke: #10b981; stroke-width: 1; opacity: 0.6; }
  .line.area { fill: rgba(16,185,129,0.15); stroke: none; }
  .led.green { fill: #10b981; }
  .led.yellow { fill: #f59e0b; }
  .led.orange { fill: #f97316; }
  .led.red { fill: #ef4444; }
  .led.dark { fill: #4b5563; }
  .led.blue { fill: #3b82f6; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .led.pulse { animation: pulse 2s ease-in-out infinite; }
  .led.red.pulse { animation: pulse 0.8s ease-in-out infinite; }
  .hm { fill: rgba(16,185,129,0.15); }
  .hm.l1 { fill: rgba(16,185,129,0.25); }
  .hm.l2 { fill: rgba(16,185,129,0.45); }
  .hm.l3 { fill: rgba(16,185,129,0.7); }
  .hm.l4 { fill: #10b981; }
</style>
</head>
<body>
<svg viewBox="0 0 900 900" class="board-svg" id="board"></svg>
<script src="board.js"></script>
</body>
</html>
