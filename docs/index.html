<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORIX Motherboard</title>
<link rel="stylesheet" href="motherboard.css">
</head>
<body>

<div class="alert-line" id="alert"></div>

<div class="board">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="dot"></div>
    <h1>🛡️ VORIX</h1>
    <div class="spacer"></div>
    <div class="stat-pill" id="status-pill">ONLINE</div>
    <div class="time" id="clock">—</div>
  </div>

  <!-- CORE (CPU) -->
  <div class="core-wrap">
    <div class="core">
      <div class="core-title">◉ VORIX CORE</div>
      <div class="core-leds">
        <div class="core-led"></div>
        <div class="core-led"></div>
        <div class="core-led"></div>
        <div class="core-led"></div>
        <div class="core-led"></div>
      </div>
      <div class="core-metrics">
        <div class="metric">
          <div class="metric-label">CPU</div>
          <div class="metric-bar"><div class="metric-fill" id="cpu-bar" style="width:0%"></div></div>
          <div class="metric-value" id="cpu-val">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">RAM</div>
          <div class="metric-bar"><div class="metric-fill" id="ram-bar" style="width:0%"></div></div>
          <div class="metric-value" id="ram-val">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">NET</div>
          <div class="metric-bar"><div class="metric-fill" id="net-bar" style="width:0%"></div></div>
          <div class="metric-value" id="net-val">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- TRACE -->
  <div class="trace-zone"><div class="trace-line"></div></div>

  <!-- CHIPSET 1 (4 اصلی) -->
  <div class="chipset chipset-4" id="chipset1"></div>

  <!-- TRACE -->
  <div class="trace-zone"><div class="trace-line"></div></div>

  <!-- CHIPSET 2 (3 جانبی) -->
  <div class="chipset chipset-3" id="chipset2"></div>

  <!-- TRACE -->
  <div class="trace-zone"><div class="trace-line"></div></div>

  <!-- SLOTS -->
  <div class="slots-wrap">
    <div class="slots-grid" id="slots"></div>
  </div>

  <!-- I/O PORTS -->
  <div class="ioports" id="ioports"></div>

  <!-- BOTTOM METRICS -->
  <div class="bottom-metrics" id="bottom"></div>

</div>

<script src="motherboard.js"></script>
</body>
</html>
