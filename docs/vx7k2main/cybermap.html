<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Threat Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02040a;color:#e5e7eb;font-family:ui-monospace,monospace;padding:10px}
h2{color:#10b981;font-size:11px;letter-spacing:3px;margin:12px 0 8px;border-bottom:1px solid #1f5f3f;padding-bottom:6px}
.tabs{display:flex;gap:3px;margin-bottom:8px;background:#0a0f1a;border:1px solid #1f2937;border-radius:8px;padding:3px}
.tabs button{flex:1;background:transparent;color:#6b7280;border:none;padding:10px;cursor:pointer;font-family:inherit;font-size:11px;border-radius:6px}
.tabs button.active{color:#0fb;background:#0f1420;box-shadow:0 0 0 1px #10b981 inset}
.wrap{background:#050a15;border:1px solid #1f5f3f;border-radius:8px;overflow:hidden;height:82vh;min-height:500px}
.wrap iframe{width:100%;height:100%;border:0;display:block}
.info{background:#0a0f1a;border:1px solid #1f2937;border-radius:6px;padding:10px;margin-top:10px;font-size:10px;color:#9ca3af;line-height:1.7}
.info b{color:#10b981}
</style>
</head>
<body>

<h2>LIVE THREAT MAP</h2>

<div class="tabs">
<button class="active" onclick="go('k', this)">Kaspersky</button>
<button onclick="go('c', this)">Check Point</button>
<button onclick="go('f', this)">Fortinet</button>
</div>

<div class="wrap">
<iframe id="f" src="https://cybermap.kaspersky.com/en/widget/dynamic/dark" allowfullscreen></iframe>
</div>

<div class="info">
<b>📊 سه نقشه زنده:</b><br>
• <b>Kaspersky</b> — نقشه ۳بعدی، میلیون‌ها honeypot<br>
• <b>Check Point</b> — ThreatCloud، ۱۰۰K+ sensor<br>
• <b>Fortinet</b> — FortiGuard، ۵M+ sensor<br><br>
<b>⚡ همه لحظه‌ای</b> — هر حمله، فوری نمایش داده می‌شه.
</div>

<script src="nav.js"></script>
<script>
var U = {
  k: 'https://cybermap.kaspersky.com/en/widget/dynamic/dark',
  c: 'https://threatmap.checkpoint.com/ThreatPortal/livemap.html',
  f: 'https://threatmap.fortiguard.net/'
};
function go(name, btn) {
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  document.getElementById('f').src = U[name];
}
</script>
</body></html>
