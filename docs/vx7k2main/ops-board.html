<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VX-OPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a12;color:#94a3b8;font-family:"SF Mono",Menlo,Consolas,monospace;padding:8px;font-size:12px}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1e293b}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border:2px solid #3b82f6;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#3b82f6;font-weight:bold;font-size:14px}
.brand-title{color:#e2e8f0;font-size:14px;font-weight:600;letter-spacing:2px}
.brand-sub{color:#475569;font-size:10px;letter-spacing:1px}
.status-msg{color:#059669;font-size:11px;display:flex;align-items:center;gap:6px}
.status-msg .dot{width:6px;height:6px;background:#059669;border-radius:50%;box-shadow:0 0 8px #059669;animation:pulse 2s infinite}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.board{background:#0a0e1a;border:1px solid #1e293b;border-radius:8px;padding:10px;position:relative;overflow:hidden}
.board::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.02) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
svg{width:100%;height:auto;display:block;position:relative;z-index:1}

/* SVG */
.box{fill:#0f1420;stroke:#1e293b;stroke-width:1}
.box.core{fill:#0d1425;stroke:#3b82f6;stroke-width:1.5;filter:drop-shadow(0 0 8px rgba(59,130,246,0.2))}
.box.module{fill:#0f1420;stroke:#1e293b;stroke-width:1}
.box.module-wide{fill:#0f1420;stroke:#1e293b;stroke-width:1}
.box.security{fill:#1a0e0e;stroke:#7f1d1d;stroke-width:1}
.box.node{fill:#0e1a14;stroke:#059669;stroke-width:1}
.box.today{fill:#1a1508;stroke:#78350f;stroke-width:1}

.t-core{fill:#e2e8f0;font-size:12px;font-weight:600;letter-spacing:2px;text-anchor:middle}
.t-core-sub{fill:#475569;font-size:9px;letter-spacing:1px;text-anchor:middle}
.t-core-active{fill:#3b82f6;font-size:9px;font-weight:600;letter-spacing:1px;text-anchor:middle}

.t-module{fill:#64748b;font-size:9px;font-weight:600;letter-spacing:2px;text-anchor:middle}
.t-num{fill:#e2e8f0;font-size:20px;font-weight:600;text-anchor:middle;font-family:"SF Mono",monospace}
.t-label{fill:#475569;font-size:8px;letter-spacing:1px;text-anchor:middle}
.t-sublabel{fill:#64748b;font-size:9px;text-anchor:middle}

.t-sec-title{fill:#f87171;font-size:10px;font-weight:600;letter-spacing:2px;text-anchor:middle}
.t-sec-label{fill:#94a3b8;font-size:9px}
.t-sec-value{fill:#e2e8f0;font-size:10px;font-weight:600}

.t-node-title{fill:#059669;font-size:10px;font-weight:600;letter-spacing:2px;text-anchor:middle}
.t-node-status{fill:#059669;font-size:11px;font-weight:600;letter-spacing:2px;text-anchor:middle}
.t-node-sub{fill:#475569;font-size:8px;letter-spacing:1px;text-anchor:middle}

.t-chart-title{fill:#f59e0b;font-size:10px;font-weight:600;letter-spacing:2px;text-anchor:middle}
.t-chart-label{fill:#475569;font-size:8px;text-anchor:middle}
.t-chart-value{fill:#e2e8f0;font-size:9px;font-weight:600;text-anchor:middle}

.t-status-name{fill:#64748b;font-size:9px;font-weight:600;letter-spacing:1px}
.t-status-online{fill:#059669;font-size:8px;letter-spacing:1px}
.t-status-load{fill:#f59e0b;font-size:8px;letter-spacing:1px}
.t-status-off{fill:#dc2626;font-size:8px;letter-spacing:1px}

.t-footer{fill:#334155;font-size:8px;letter-spacing:1px;text-anchor:middle}

/* LEDs */
.led{transition:all 0.3s}
.led.green{fill:#059669;filter:drop-shadow(0 0 4px #059669)}
.led.yellow{fill:#d97706;filter:drop-shadow(0 0 4px #d97706)}
.led.red{fill:#dc2626;filter:drop-shadow(0 0 4px #dc2626)}
.led.dark{fill:#1e293b}
.led.blue{fill:#3b82f6;filter:drop-shadow(0 0 4px #3b82f6)}
.led.pulse{animation:pulse 1.8s infinite}
.line{stroke:#1e293b;stroke-width:1}
.line-dash{stroke:#1e293b;stroke-width:1;stroke-dasharray:2 3}

.bar-bg{fill:#070a12}
.bar-fg{fill:url(#grad-bar)}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="logo">VX</div>
    <div>
      <div class="brand-title">VX-OPS</div>
      <div class="brand-sub">MONITORING CONSOLE</div>
    </div>
  </div>
  <div class="status-msg">
    <span class="dot"></span>
    <span id="live">LIVE · LOADING</span>
  </div>
</div>

<div class="board">
  <svg id="board" viewBox="0 0 900 780" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<script src="nav.js"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('board');
let DATA = null;
let SERVICES = null;

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function box(x, y, w, h, cls) { svg.appendChild(el('rect', {x, y, width: w, height: h, rx: 6, class: 'box ' + (cls||'')})); }
function text(x, y, txt, cls, anchor) {
  const e = el('text', {x, y, class: cls||'t-label'});
  e.textContent = txt;
  if (anchor) e.setAttribute('text-anchor', anchor);
  svg.appendChild(e);
}
function led(cx, cy, r, color, pulse) {
  svg.appendChild(el('circle', {cx, cy, r: r||4, class: 'led ' + (color||'green') + (pulse?' pulse':'')}));
}
function bar(x, y, w, h, pct) {
  svg.appendChild(el('rect', {x, y, width: w, height: h, rx: 2, class: 'bar-bg'}));
  const fw = Math.max(2, (pct/100) * w);
  svg.appendChild(el('rect', {x, y, width: fw, height: h, rx: 2, class: 'bar-fg'}));
}

function fmt(n) { try { return Number(n||0).toLocaleString('en-US'); } catch(e) { return '0'; } }
function fmtShort(n) {
  n = Number(n||0);
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(0) + 'K';
  return String(n);
}

function calc() {
  if (!DATA) return null;
  const u = (DATA.users||[]).length;
  const o = (DATA.orders||[]).length;
  const p = (DATA.payments||[]).length;
  const r = (DATA.receipts||[]).length;
  const a = (DATA.activity||[]).length;
  let totalRev = 0, todayRev = 0, todayOrders = 0, pending = 0, done = 0, failed = 0;
  const today = new Date().toISOString().substring(0,10);
  (DATA.orders||[]).forEach(x => {
    totalRev += x.total_price || 0;
    const d = (x.created_at||'').substring(0,10);
    if (d === today) { todayRev += x.total_price || 0; todayOrders++; }
  });
  (DATA.payments||[]).forEach(x => {
    if (x.status === 'pending') pending++;
    if (x.status === 'done' || x.status === 'paid') done++;
    if (x.status === 'failed') failed++;
  });
  const ub = new Set((DATA.orders||[]).map(o => o.user_id)).size;
  return {users: u, orders: o, payments: p, receipts: r, activity: a,
          totalRev, todayRev, todayOrders, pending, done, failed, uniqueBuyers: ub};
}

function renderBoard() {
  svg.innerHTML = '';
  if (!DATA) return;
  const s = calc();

  // ═══ STATUS BAR — 5 LEDs ═══
  box(0, 0, 900, 42, 'module');
  const svc = (SERVICES && SERVICES.services) || {};
  const services = [
    {name: 'M-01', x: 60,  ok: (svc.CORE && svc.CORE.running) || false},
    {name: 'M-02', x: 240, ok: (svc.BRIDGE && svc.BRIDGE.running) || false},
    {name: 'M-03', x: 420, ok: (svc.API && svc.API.running) || false},
    {name: 'M-04', x: 600, ok: (svc.SHIELD && svc.SHIELD.running) || false},
    {name: 'M-05', x: 780, ok: (svc.VAULT && svc.VAULT.running) || false},
  ];
  services.forEach(sv => {
    const color = sv.ok ? 'green' : 'yellow';
    const label = sv.ok ? 'ONLINE' : 'LOAD';
    const cls = sv.ok ? 't-status-online' : 't-status-load';
    led(sv.x, 21, 5, color, sv.ok);
    text(sv.x + 10, 18, sv.name, 't-status-name');
    text(sv.x + 10, 32, label, cls);
  });

  // ═══ CORE ═══
  box(320, 60, 260, 80, 'core');
  text(450, 85, 'VX-OPS CORE', 't-core');
  text(450, 103, 'active node', 't-core-sub');
  text(450, 122, '●  OPERATIONAL', 't-core-active');
  led(340, 80, 5, 'blue', true);

  // ═══ ROW 1 — 4 modules ═══
  // USERS
  box(40, 160, 200, 85, 'module');
  text(140, 182, 'NODE-USR', 't-module');
  text(140, 215, fmt(s.users), 't-num');
  text(140, 233, 'registered · ' + s.uniqueBuyers + ' active', 't-label');

  // ORDERS
  box(255, 160, 200, 85, 'module');
  text(355, 182, 'TXN-LOG', 't-module');
  text(355, 215, fmt(s.orders), 't-num');
  text(355, 233, 'transactions', 't-label');

  // PAYMENTS
  box(470, 160, 200, 85, 'module');
  text(570, 182, 'PAY-NODE', 't-module');
  text(570, 215, fmt(s.payments), 't-num');
  text(570, 233, s.pending + ' pend · ' + s.done + ' ok', 't-label');

  // REVENUE
  box(685, 160, 200, 85, 'today');
  text(785, 182, 'YIELD-T', 't-module');
  text(785, 215, fmtShort(s.totalRev), 't-num');
  text(785, 233, 'total revenue', 't-label');

  // ═══ ROW 2 ═══
  box(40, 260, 145, 70, 'module');
  text(112, 282, 'PROD', 't-module');
  text(112, 310, fmt(3), 't-num');

  box(200, 260, 145, 70, 'module');
  text(272, 282, 'RCPT', 't-module');
  text(272, 310, fmt(s.receipts), 't-num');

  box(360, 260, 145, 70, 'module');
  text(432, 282, 'TODAY', 't-module');
  text(432, 310, fmt(s.todayOrders), 't-num');

  box(520, 260, 365, 70, 'module-wide');
  text(702, 282, 'EVENT-STREAM', 't-module');
  text(702, 308, fmt(s.activity) + ' events', 't-num');
  bar(540, 320, 325, 4, Math.min(100, s.activity / 5));

  // ═══ TIMELINE ═══
  box(40, 350, 845, 120, 'module-wide');
  text(460, 372, 'ACTIVITY · 7D', 't-chart-title');

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().substring(0,10);
    let count = 0;
    (DATA.orders||[]).forEach(x => {
      if ((x.created_at||'').substring(0,10) === key) count++;
    });
    days.push({day: key.substring(8), count});
  }
  const maxC = Math.max(...days.map(x => x.count), 1);
  days.forEach((d, i) => {
    const x = 90 + i * 112;
    const h = Math.max(8, (d.count/maxC) * 55);
    const y = 445 - h;
    svg.appendChild(el('rect', {x, y, width: 90, height: h, rx: 3, fill: 'url(#grad-bar)'}));
    text(x + 45, 462, d.day, 't-chart-label');
    text(x + 45, y - 5, d.count, 't-chart-value');
  });

  // ═══ SECURITY MODULE ═══
  box(40, 490, 410, 155, 'security');
  text(245, 512, 'SEC-MODULE · 10 LAYER', 't-sec-title');

  const secItems = [
    {name: 'HMAC-TOKEN',   v: 0},
    {name: 'SIG-VERIFY',   v: 0},
    {name: 'IP-ALLOW',     v: 0},
    {name: 'RATE-LIMIT',   v: 0},
    {name: 'ANOMALY',      v: 0},
    {name: 'HONEYPOT',     v: 0},
    {name: 'HASH-CHAIN',   v: 0},
    {name: 'AES-VAULT',    v: 0},
    {name: 'BRUTE-GUARD',  v: 0},
    {name: 'TG-ALERTS',    v: 0},
  ];
  secItems.forEach((item, i) => {
    const y = 542 + i * 11;
    const color = item.v > 0 ? 'red' : 'green';
    led(58, y - 3, 3, color);
    text(72, y, item.name, 't-sec-label');
    text(430, y, String(item.v).padStart(3, '0'), 't-sec-value');
  });

  // ═══ NODE ═══
  box(470, 490, 200, 155, 'node');
  text(570, 512, 'NODE-A', 't-node-title');
  svg.appendChild(el('circle', {cx: 570, cy: 570, r: 30, fill: 'none', stroke: '#059669', 'stroke-width': 1.5}));
  svg.appendChild(el('circle', {cx: 570, cy: 570, r: 20, fill: 'none', stroke: '#059669', 'stroke-width': 0.5, 'stroke-dasharray': '2 4'}));
  svg.appendChild(el('circle', {cx: 570, cy: 570, r: 6, fill: '#059669', class: 'pulse'}));
  led(540, 542, 3, 'green', true);
  led(600, 542, 3, 'green', true);
  text(570, 622, 'ONLINE', 't-node-status');
  text(570, 637, 'SECURE CHANNEL', 't-node-sub');

  // ═══ VAULT ═══
  box(690, 490, 195, 155, 'module');
  text(787, 512, 'VAULT', 't-module');
  // آیکون قفل هندسی
  svg.appendChild(el('rect', {x: 775, y: 540, width: 24, height: 18, rx: 3, fill: 'none', stroke: '#3b82f6', 'stroke-width': 1.5}));
  svg.appendChild(el('path', {d: 'M 779 540 Q 779 528 787 528 Q 795 528 795 540', fill: 'none', stroke: '#3b82f6', 'stroke-width': 1.5}));
  svg.appendChild(el('circle', {cx: 787, cy: 549, r: 2, fill: '#3b82f6'}));
  text(787, 580, '2026-W40', 't-num');
  text(787, 598, 'last snapshot', 't-label');
  svg.appendChild(el('line', {x1: 712, y1: 612, x2: 862, y2: 612, class: 'line-dash'}));
  text(787, 628, 'SNAP: 100  DLY: 30', 't-label');
  text(787, 640, '11 MB', 't-sublabel');

  // ═══ ADVANCED STATS ═══
  box(40, 660, 845, 75, 'module-wide');
  text(460, 680, 'METRICS', 't-chart-title');

  const stats = [
    {lbl: 'AVG-TXN', val: s.orders ? Math.round(s.totalRev/s.orders) : 0},
    {lbl: 'TODAY',   val: fmtShort(s.todayRev)},
    {lbl: 'PEND',    val: s.pending},
    {lbl: 'SUCCESS', val: s.done},
    {lbl: 'EVENTS',  val: s.activity},
    {lbl: 'NODES',   val: s.users},
  ];
  stats.forEach((st, i) => {
    const x = 70 + i * 140;
    text(x, 715, String(st.val), 't-num');
    text(x, 730, st.lbl, 't-label');
  });

  // ═══ DEFS ═══
  const defs = el('defs', {});
  defs.innerHTML = '<linearGradient id="grad-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>';
  svg.appendChild(defs);

  // ═══ FOOTER ═══
  text(450, 758, 'VX-OPS  ·  MONITORING SYSTEM  ·  SECURE CHANNEL', 't-footer');

  // Update live
  document.getElementById('live').innerHTML = 'LIVE · ' + (DATA.ts||'').substring(11,19);
}

function loadServices() {
  fetch('../data/services_status.json?v=' + Date.now())
    .then(r => r.json())
    .then(d => { SERVICES = d; renderBoard(); })
    .catch(e => { console.error('services:', e); });
}

function load() {
  fetch('../data/shop_all.json?v=' + Date.now())
    .then(r => r.json())
    .then(d => { DATA = d; renderBoard(); })
    .catch(e => { console.error(e); });
}

load();
loadServices();
setInterval(load, 20000);
setInterval(loadServices, 15000);
</script>
</body>
</html>
