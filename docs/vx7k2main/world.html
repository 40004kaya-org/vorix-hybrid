<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Attacks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070d;color:#e5e7eb;font-family:ui-monospace,monospace;padding:10px}
h2{color:#10b981;font-size:12px;letter-spacing:2px;margin:12px 0 8px;
   border-bottom:1px solid #1f5f3f;padding-bottom:6px}
.live{color:#6b7280;font-size:10px;text-align:center;margin-bottom:8px}
.live b{color:#10b981}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.st{background:#0f1420;border:1px solid #1f2937;border-radius:8px;
    padding:10px 4px;text-align:center}
.st .n{font-size:16px;font-weight:bold;color:#10b981}
.st .l{font-size:9px;color:#6b7280;margin-top:2px}
.st.r .n{color:#ef4444}.st.y .n{color:#f59e0b}.st.c .n{color:#06b6d4}

.mw{background:#050a15;border:1px solid #1f5f3f;border-radius:10px;
    padding:8px;position:relative;overflow:hidden}
svg.world{width:100%;height:auto;display:block}
.cont{fill:#0a1520;stroke:#1f5f3f;stroke-width:0.8}
.gr{stroke:rgba(16,185,129,0.05);stroke-width:0.5}
.hit{fill:#ef4444;filter:drop-shadow(0 0 6px #ef4444)}
.hit.mid{fill:#f59e0b;filter:drop-shadow(0 0 6px #f59e0b)}
.hit.small{fill:#10b981;filter:drop-shadow(0 0 4px #10b981)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes ping{0%{r:6;opacity:.8}100%{r:30;opacity:0}}
.ping{animation:ping 2s ease-out infinite}

.lg{display:flex;gap:12px;justify-content:center;font-size:10px;
    color:#6b7280;margin-top:10px;flex-wrap:wrap}
.lg span{display:flex;align-items:center;gap:4px}
.lg .d{width:8px;height:8px;border-radius:50%}

.lst{display:flex;flex-direction:column;gap:3px;max-height:400px;overflow-y:auto}
.it{background:#0f1420;border-right:3px solid #333;border-radius:4px;
    padding:7px 10px;font-size:11px;display:flex;gap:8px;align-items:center}
.it.top{border-right-color:#ef4444}
.it .rk{color:#6b7280;font-size:9px;min-width:22px}
.it .ip{color:#10b981;font-family:monospace;flex:1;font-size:10px;
        direction:ltr;text-align:left}
.it .cc{color:#f59e0b;font-weight:bold;min-width:26px;font-size:10px}
.it .cnt{color:#ef4444;font-weight:bold;min-width:55px;text-align:left;
         direction:ltr;font-size:10px}
.it .isp{color:#6b7280;font-size:9px;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap;max-width:80px}

.c2{background:#2a1010;border-right:3px solid #ef4444;border-radius:4px;
    padding:7px 10px;font-size:10px;display:flex;gap:8px;margin-bottom:3px}
.c2 .ip{color:#fca5a5;font-family:monospace;flex:1;direction:ltr}
.c2 .mw{color:#fbbf24;font-weight:bold;font-size:9px}
.c2 .pt{color:#6b7280;font-size:9px}

.bars{margin-top:8px}
.br{display:flex;align-items:center;gap:8px;font-size:10px;margin-bottom:4px}
.br .n{width:30px;color:#f59e0b;font-weight:bold}
.br .b{flex:1;height:12px;background:#0a0a0a;border-radius:3px;overflow:hidden}
.br .f{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);border-radius:3px}
.br .v{width:60px;color:#10b981;font-size:9px;text-align:left;direction:ltr}
</style></head><body>

<h2>GLOBAL ATTACK MAP — LIVE</h2>
<div class="live" id="live">در حال بارگذاری... <b>●</b></div>

<div class="stats">
  <div class="st r"><div class="n" id="s-att">0</div><div class="l">کل حمله</div></div>
  <div class="st y"><div class="n" id="s-ip">0</div><div class="l">IP فعال</div></div>
  <div class="st c"><div class="n" id="s-cc">0</div><div class="l">کشور</div></div>
  <div class="st"><div class="n" id="s-c2">0</div><div class="l">C2 سرور</div></div>
</div>

<div class="mw">
  <svg class="world" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
    <g>
      <line class="gr" x1="0" y1="125" x2="1000" y2="125"/>
      <line class="gr" x1="0" y1="250" x2="1000" y2="250"/>
      <line class="gr" x1="0" y1="375" x2="1000" y2="375"/>
      <line class="gr" x1="250" y1="0" x2="250" y2="500"/>
      <line class="gr" x1="500" y1="0" x2="500" y2="500"/>
      <line class="gr" x1="750" y1="0" x2="750" y2="500"/>
    </g>
    <g>
      <path class="cont" d="M110,110 Q140,80 200,95 L260,110 Q290,125 285,165 L255,205 Q220,235 185,240 L145,225 Q120,195 115,165 Z"/>
      <path class="cont" d="M255,255 Q300,245 330,265 L345,310 Q340,360 315,400 Q290,430 270,415 L245,375 Q235,320 245,280 Z"/>
      <path class="cont" d="M475,105 Q510,90 555,95 L590,115 Q595,145 575,175 L540,185 Q505,180 485,155 Q470,135 475,105 Z"/>
      <path class="cont" d="M470,195 Q530,180 585,190 L605,230 Q610,290 585,340 Q555,385 520,375 L485,335 Q470,285 465,240 Z"/>
      <path class="cont" d="M600,95 Q680,80 780,85 L870,105 Q920,130 925,175 L910,215 Q870,245 805,240 L730,225 Q670,205 625,175 Q605,140 600,95 Z"/>
      <path class="cont" d="M690,205 Q730,195 745,220 L750,265 Q735,290 715,285 L695,250 Z"/>
      <path class="cont" d="M810,345 Q870,330 910,345 L925,395 Q915,425 875,435 L830,420 Q805,395 810,345 Z"/>
    </g>
    <g id="hits"></g>
  </svg>
  <div class="lg">
    <span><span class="d" style="background:#ef4444"></span>خیلی زیاد (>100K)</span>
    <span><span class="d" style="background:#f59e0b"></span>زیاد (10K-100K)</span>
    <span><span class="d" style="background:#10b981"></span>متوسط (<10K)</span>
  </div>
</div>

<h2>حملات بر اساس کشور</h2>
<div class="bars" id="cc"></div>

<h2>Top 20 IP مهاجم</h2>
<div class="lst" id="ips"></div>

<h2>سرورهای C2 فعال</h2>
<div id="c2"></div>

<script src="nav.js"></script>
<script>
var COORDS = {
  'US':[200,155],'CA':[205,110],'MX':[195,215],
  'BR':[310,320],'AR':[290,370],'CL':[275,390],'CO':[270,280],
  'GB':[490,125],'IE':[478,130],'FR':[500,150],'DE':[535,140],
  'NL':[510,135],'BE':[512,142],'PL':[548,132],'ES':[490,160],
  'PT':[478,162],'IT':[535,165],'SE':[545,105],'NO':[535,98],
  'FI':[560,100],'DK':[535,118],'CH':[520,152],'AT':[540,155],
  'CZ':[538,138],'RO':[562,155],'BG':[568,162],'GR':[552,172],
  'UA':[578,138],'RU':[690,125],'BY':[565,125],'LT':[558,120],
  'LV':[562,113],'EE':[565,108],
  'TR':[560,160],'IR':[655,205],'SA':[590,225],'AE':[630,235],
  'IL':[570,215],'EG':[560,200],'MA':[490,190],'DZ':[510,195],
  'LY':[535,200],'ZA':[545,340],'NG':[510,255],'KE':[580,290],
  'CN':[790,180],'JP':[870,175],'KR':[840,170],'TW':[820,200],
  'HK':[815,210],'VN':[790,215],'TH':[775,235],'MY':[785,260],
  'SG':[790,275],'ID':[820,290],'PH':[835,235],'IN':[715,235],
  'PK':[690,205],'BD':[740,225],'LK':[720,270],
  'AU':[860,375],'NZ':[935,395],'SC':[615,290],'MD':[567,155]
};

function sevClass(cnt) {
  if (cnt > 100000) return 'hit';
  if (cnt > 10000) return 'hit mid';
  return 'hit small';
}

function esc(s){return String(s).replace(/[<>&]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}

function fmtNum(n) {
  return Number(n).toLocaleString('en-US');
}

function render(data) {
  if (!data) return;
  var attacks = data.attacks || [];
  var countries = data.countries || {};
  var feodo = data.feodo || [];
  var stats = data.stats || {};

  document.getElementById('live').innerHTML = 
    'آخرین آپدیت: <b>' + (data.ts || '').replace('T',' ').substring(0,19) + '</b> ●';
  document.getElementById('s-att').textContent = fmtNum(stats.total_attacks || 0);
  document.getElementById('s-ip').textContent = stats.unique_ips || 0;
  document.getElementById('s-cc').textContent = stats.unique_countries || 0;
  document.getElementById('s-c2').textContent = stats.c2_count || 0;

  // Hits on map
  var hits = document.getElementById('hits');
  var html = '';
  attacks.forEach(function(a, i) {
    var c = a.country;
    var xy = COORDS[c];
    if (!xy) return;
    // jitter
    var jx = (Math.random()-0.5) * 12;
    var jy = (Math.random()-0.5) * 12;
    var cls = sevClass(a.count);
    html += '<circle class="' + cls + ' pulse" cx="' + (xy[0]+jx) + 
            '" cy="' + (xy[1]+jy) + '" r="' + (a.count > 100000 ? 5 : 4) +
            '" style="animation-delay:' + (i*0.05) + 's"/>';
  });
  // یه ping ثابت روی اولین حمله‌کننده
  if (attacks.length && COORDS[attacks[0].country]) {
    var xy0 = COORDS[attacks[0].country];
    html += '<circle class="ping" cx="' + xy0[0] + '" cy="' + xy0[1] +
            '" r="8" fill="none" stroke="#ef4444" stroke-width="2"/>';
  }
  hits.innerHTML = html;

  // Countries bars
  var cc = document.getElementById('cc');
  var ccKeys = Object.keys(countries).slice(0, 12);
  var maxC = ccKeys.length ? Math.max.apply(null, ccKeys.map(function(k){return countries[k]})) : 1;
  cc.innerHTML = ccKeys.map(function(k) {
    var pct = (countries[k] / maxC * 100).toFixed(0);
    return '<div class="br">' +
      '<div class="n">' + k + '</div>' +
      '<div class="b"><div class="f" style="width:' + pct + '%"></div></div>' +
      '<div class="v">' + fmtNum(countries[k]) + '</div>' +
      '</div>';
  }).join('');

  // Top IPs
  var ips = document.getElementById('ips');
  ips.innerHTML = attacks.slice(0, 20).map(function(a, i) {
    return '<div class="it ' + (i < 5 ? 'top' : '') + '">' +
      '<span class="rk">#' + (i+1) + '</span>' +
      '<span class="ip">' + esc(a.ip) + '</span>' +
      '<span class="cc">' + esc(a.country) + '</span>' +
      '<span class="cnt">' + fmtNum(a.count) + '</span>' +
      '<span class="isp">' + esc(a.isp || '') + '</span>' +
      '</div>';
  }).join('');

  // C2
  var c2 = document.getElementById('c2');
  if (!feodo.length) {
    c2.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:11px">C2 فعالی نیست</div>';
  } else {
    c2.innerHTML = feodo.slice(0, 20).map(function(x) {
      return '<div class="c2">' +
        '<span class="ip">' + esc(x.ip) + ':' + (x.port || '?') + '</span>' +
        '<span class="mw">' + esc(x.malware) + '</span>' +
        '<span class="pt">' + esc(x.country) + '</span>' +
        '</div>';
    }).join('');
  }
}

function load() {
  fetch('../data/live_global.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(e){ console.error(e); });
}

load();
setInterval(load, 30000);
</script>
</body></html>
