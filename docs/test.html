<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Chart</title>
<script src="chart.min.js"></script>
</head>
<body style="background:#0a0e1a;color:#fff;padding:20px">
<h1>Chart Test</h1>
<p id="status">Loading...</p>
<canvas id="testChart" style="max-width:400px"></canvas>
<script>
window.onload = function() {
  document.getElementById('status').textContent = 
    'Chart type: ' + typeof Chart;
  if (typeof Chart !== 'undefined') {
    new Chart(document.getElementById('testChart'), {
      type: 'line',
      data: {
        labels: ['A','B','C','D','E'],
        datasets: [{
          label: 'Test',
          data: [1,3,2,5,4],
          borderColor: '#10b981',
          backgroundColor: 'rgba(16,185,129,0.1)',
          tension: 0.4,
          fill: true,
        }]
      }
    });
    document.getElementById('status').textContent = 'Chart loaded! ✅';
  }
};
</script>
</body>
</html>
