<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test</title>
<style>
body{background:#111;color:#0f0;font-family:monospace;padding:20px}
input,button{font-size:20px;padding:10px;margin:5px 0;width:100%}
#out{background:#000;padding:10px;margin-top:20px;min-height:200px;white-space:pre-wrap;word-break:break-all;color:#0f0}
</style></head>
<body>
<h1>VORIX TEST</h1>
<input id="p" placeholder="تایپ کن" autocomplete="off">
<button onclick="go()">TEST</button>
<div id="out">آماده...</div>
<script>
async function go() {
  const pin = document.getElementById('p').value;
  const out = document.getElementById('out');
  out.textContent = 'input received:\n  raw=[' + pin + ']\n  len=' + pin.length + '\n  chars=' + Array.from(pin).map(c => c + '(' + c.charCodeAt(0) + ')').join(',') + '\n\n';

  try {
    const buf = new TextEncoder().encode(pin);
    out.textContent += 'bytes: ' + buf.length + '\n\n';
    const h = await crypto.subtle.digest('SHA-256', buf);
    const hex = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
    out.textContent += 'HASH:\n' + hex + '\n\n';
    out.textContent += 'REVERSED:\n' + hex.split('').reverse().join('');
  } catch(e) {
    out.textContent += 'ERROR: ' + e.message;
  }
}
</script>
</body>
</html>
