<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORIX Board</title>
<link rel="stylesheet" href="style.css">
<script>
  const params = new URLSearchParams(location.search);
  const k = params.get('k');
  window.__VORIX_PIN__ = k;
  window.__DEBUG_LOG__ = [];
  window.__DBG__ = (m) => {
    window.__DEBUG_LOG__.push(m);
    const el = document.getElementById('dbgbox');
    if (el) el.textContent = window.__DEBUG_LOG__.join('\n');
  };
</script>
<style>
#dbgbox {
  position: fixed; top: 0; left: 0; right: 0;
  background: #000; color: #0f0; padding: 6px;
  font-size: 11px; font-family: monospace;
  white-space: pre-wrap; z-index: 99999;
  max-height: 200px; overflow: auto;
  border-bottom: 1px solid #0f0;
}
</style>
</head>
<body>
<div id="dbgbox">boot...
k = 'PLACEHOLDER'</div>
<svg id="board" viewBox="0 0 900 780" preserveAspectRatio="xMidYMid meet"></svg>
<script>
  document.getElementById('dbgbox').textContent = 
    'boot\nk param = [' + (window.__VORIX_PIN__ || 'NULL') + ']\nlen(k) = ' + (window.__VORIX_PIN__ ? window.__VORIX_PIN__.length : 0);
</script>
<script src="board.js?v=100"></script>
</body>
</html>
