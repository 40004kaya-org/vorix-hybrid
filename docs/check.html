<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORIX CHECK</title>
<style>
body{background:#111;color:#0f0;font-family:monospace;padding:20px}
input,button{font-size:20px;padding:10px;margin:5px 0;width:100%}
#out{background:#000;padding:10px;margin-top:20px;min-height:200px;white-space:pre-wrap;word-break:break-all;color:#0f0;font-size:12px}
h1{color:#0fb}
</style></head>
<body>
<h1>VORIX CHECK</h1>
<input id="p" placeholder="پسورد" autocomplete="off">
<button onclick="go()">TEST</button>
<div id="out">آماده...</div>
<script>
async function go() {
  const pin = document.getElementById('p').value;
  const out = document.getElementById('out');
  out.textContent = 'RAW=[' + pin + ']\n';
  out.textContent += 'LEN=' + pin.length + '\n\n';
  out.textContent += 'CHARS:\n' + Array.from(pin).map(c => c + '=' + c.charCodeAt(0)).join('\n') + '\n\n';
  try {
    const buf = new TextEncoder().encode(pin);
    out.textContent += 'BYTES=' + buf.length + '\n\n';
    const h = await crypto.subtle.digest('SHA-256', buf);
    const hex = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
    out.textContent += 'SHA256:\n' + hex + '\n\n';
    out.textContent += 'REVERSED:\n' + hex.split('').reverse().join('');
  } catch(e) { out.textContent += 'ERR: ' + e.message; }
}
</script>
</body>
</html>
